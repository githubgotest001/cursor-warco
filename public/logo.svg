<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- UMBRELLA 4365 : Umbrella Corp 8-wedge canopy x Cursor hexagonal cube x central caret -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <!-- hexagon red halo -->
  <polygon points="60,6 106.77,33 106.77,87 60,114 13.23,87 13.23,33"
           fill="none" stroke="#e0242e" stroke-width="5" opacity=".3" filter="url(#glow)"/>

  <!-- isometric cube edges (hidden under the canopy) -->
  <g stroke="#e9e6df" stroke-width="1.4" opacity=".22">
    <line x1="60" y1="60" x2="60" y2="6"/>
    <line x1="60" y1="60" x2="13.23" y2="87"/>
    <line x1="60" y1="60" x2="106.77" y2="87"/>
  </g>

  <!-- 8-wedge red/white canopy with inward tension curves -->
  <g stroke="#0a0b0e" stroke-width=".8" stroke-linejoin="round">
    <path d="M60,60 L44.69,23.04 Q60,27 75.31,23.04 Z" fill="#e0242e"/>
    <path d="M60,60 L75.31,23.04 Q83.33,36.67 96.96,44.69 Z" fill="#e9e6df"/>
    <path d="M60,60 L96.96,44.69 Q93,60 96.96,75.31 Z" fill="#e0242e"/>
    <path d="M60,60 L96.96,75.31 Q83.33,83.33 75.31,96.96 Z" fill="#e9e6df"/>
    <path d="M60,60 L75.31,96.96 Q60,93 44.69,96.96 Z" fill="#e0242e"/>
    <path d="M60,60 L44.69,96.96 Q36.67,83.33 23.04,75.31 Z" fill="#e9e6df"/>
    <path d="M60,60 L23.04,75.31 Q27,60 23.04,44.69 Z" fill="#e0242e"/>
    <path d="M60,60 L23.04,44.69 Q36.67,36.67 44.69,23.04 Z" fill="#e9e6df"/>
  </g>

  <!-- hexagon main outline -->
  <polygon points="60,6 106.77,33 106.77,87 60,114 13.23,87 13.23,33"
           fill="none" stroke="#e9e6df" stroke-width="2.4"/>

  <!-- center: hub + caret -->
  <circle cx="60" cy="60" r="7.5" fill="#0a0b0e"/>
  <rect x="56.5" y="51" width="7" height="18" rx="1.2" fill="#fff" opacity=".55" filter="url(#glow)"/>
  <rect x="57.2" y="51.8" width="5.6" height="16.4" rx="1" fill="#f4f2ec"/>
</svg>
